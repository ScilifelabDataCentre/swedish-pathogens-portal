{% load plotly_js %}

{% comment %}
The DRR PCA in one colouring, rendered identically by the page and by the PCA's
swap route, so the swapped figure keeps its id and repeated swaps keep working.
{% endcomment %}
<figure id="drr-pca" class="my-8" role="img" aria-label="{{ figure.alt_text }}">
    {% if figure.plot_html %}
    {% plotlyjs_once %}
    <div class="plotly-figure" style="height: {{ figure.height }}px;">
        {{ figure.plot_html|safe }}
    </div>
    {% else %}
    <p class="text-sm text-gray-500">Chart data is not available for this figure.</p>
    {% endif %}

    {% if figure.caption %}
    <figcaption class="text-sm italic text-gray-500 mt-2 text-center">
        {{ figure.caption }}
    </figcaption>
    {% endif %}
</figure>
