{# One facet checkbox, styled as on the Portal data page. Expects "facet" and "item" ({value, id, count_display}). #}
<li>
    <label for="{{ item.id }}" class="flex cursor-pointer items-center gap-2 py-0.5">
        <input type="checkbox" id="{{ item.id }}" name="{{ facet.field }}" value="{{ item.value.value }}"
            class="checkbox checkbox-accent checkbox-sm facet-checkbox" {% if item.value.selected %}checked{% endif %}>
        <span class="text-sm">{{ item.value.label }}</span>
        <span class="badge badge-ghost badge-sm ml-auto">{{ item.count_display }}</span>
    </label>
</li>
