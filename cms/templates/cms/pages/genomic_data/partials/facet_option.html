{# One facet checkbox. Expects "facet" (field) and "item" ({value, id, count_display}). #}
<label for="{{ item.id }}" class="flex items-start gap-2 py-0.5 text-sm cursor-pointer">
    <input type="checkbox" id="{{ item.id }}" name="{{ facet.field }}" value="{{ item.value.value }}"
        class="checkbox checkbox-xs mt-0.5" {% if item.value.selected %}checked{% endif %}>
    <span class="grow">{{ item.value.label }}</span>
    <span class="text-gray-600">{{ item.count_display }}</span>
</label>
