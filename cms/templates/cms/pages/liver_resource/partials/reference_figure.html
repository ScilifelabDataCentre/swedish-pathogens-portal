{% load ai_images %}

{% cms_image page.image "format-webp" "width-360" as ref_preview %}
{% cms_image page.image "format-webp" "width-1800" as ref_zoom %}

{# Reuses the existing Wagtail card image; compact float beside intro text. #}
<figure
    id="liver-reference-figure"
    class="float-none md:float-right mx-0 md:ml-6 md:mr-0 mb-4 w-40 sm:w-48 md:w-56"
>
    <button
        type="button"
        id="liver-reference-figure-open"
        class="block w-full text-left cursor-zoom-in focus:outline-none focus-visible:ring-2 focus-visible:ring-accent rounded"
        aria-haspopup="dialog"
        aria-controls="liver-reference-figure-dialog"
        title="Click to zoom"
    >
        <img
            src="{{ ref_preview.url }}"
            alt="{{ page.image.title|default:'HepaGeNIE reference TLN map' }}"
            class="w-full h-auto rounded border border-pp-pale-grey block"
            width="{{ ref_preview.width }}"
            height="{{ ref_preview.height }}"
            loading="lazy"
        />
        <span class="sr-only">Click to zoom reference TLN map</span>
    </button>
    {% if page.image_caption %}
        <figcaption class="text-sm text-pp-dark-grey mt-1 italic text-center block w-full wrap-break-word">
            {{ page.image_caption }}
        </figcaption>
    {% endif %}
</figure>

<dialog
    id="liver-reference-figure-dialog"
    class="modal"
    aria-labelledby="liver-reference-figure-dialog-title"
>
    <div
        class="modal-box max-w-5xl w-11/12 h-[90vh] max-h-[90vh] overflow-hidden p-3 sm:p-4 relative flex flex-col"
    >
        <form method="dialog" class="absolute top-2 right-2 z-20">
            <button
                type="submit"
                class="btn btn-sm btn-circle btn-ghost"
                aria-label="Close reference figure"
            >
                ✕
            </button>
        </form>
        <h3
            id="liver-reference-figure-dialog-title"
            class="font-medium text-base text-center mb-3 shrink-0"
        >
            Reference TLN map
        </h3>
        <div class="flex-1 min-h-0 w-full flex items-center justify-center">
            <img
                src="{{ ref_zoom.url }}"
                alt="{{ page.image.title|default:'HepaGeNIE reference TLN map' }} (zoomed)"
                class="block max-w-full max-h-full w-auto h-auto object-contain rounded"
                width="{{ ref_zoom.width }}"
                height="{{ ref_zoom.height }}"
            />
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button type="submit" aria-label="Close reference figure backdrop">close</button>
    </form>
</dialog>
