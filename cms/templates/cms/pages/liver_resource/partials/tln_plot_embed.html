{% load plotly_js %}

{% plotlyjs_once %}
<div
    id="liver-tln-plot"
    class="plotly-figure w-full flex-1 min-h-0"
    style="min-height: {{ height }}px; height: {{ height }}px;"
    data-leaf-trace-index="{{ leaf_trace_index }}"
    data-cutoff="{{ cutoff|default:'0.05_1.5' }}"
    data-adj-p="{{ adj_p|default:'0.05' }}"
    data-logfc-fold="{{ logfc_fold|default:'1.5' }}"
    data-plot-metric="{{ plot_metric|default:'difference' }}"
    data-plot-mode="{{ plot_mode|default:'solid' }}"
    role="img"
    aria-label="HepaGeNIE tree-leaf network"
>
    {% if plot_html %}
        {{ plot_html|safe }}
    {% else %}
        <p class="text-sm text-gray-500 p-4">Chart could not be rendered.</p>
    {% endif %}
</div>
