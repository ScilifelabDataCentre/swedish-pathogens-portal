{% if results %}
<ul class="menu bg-white rounded-box shadow border border-pp-pale-grey w-full p-1" role="listbox">
    {% for page in results %}
    <li role="option"><a href="{{ page.url }}">{{ page.title }}</a></li>
    {% endfor %}
</ul>
{% elif query %}
<div class="bg-white rounded-box shadow border border-pp-pale-grey p-3 text-sm text-pp-dark-grey">
    No matches
</div>
{% endif %}
