# docker-compose.yaml
# Docker Compose configuration for Swedish Pathogens Portal (SPP)
---
name: SPP
services:
  # Portal website
  web:
    build:
      context: ./
      dockerfile: Dockerfile
      target: dev
      args:
        with_pygraphviz: ${with_pygraphviz:-false}
    image: swedish_pathogens_portal
    pull_policy: never
    container_name: spp_web
    entrypoint: python manage.py runserver_plus --nopin 0.0.0.0:8000
    env_file:
      - .env
    environment:
      - DATABASE_URL=psql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    ports:
      - "8000:8000"
    working_dir: /app/local
    volumes:
      - type: bind
        source: ./
        target: /app/local
    depends_on:
      db:
        condition: service_healthy
        restart: true
      tailwind:
        condition: service_started
  # Postgresql DB
  db:
    image: postgres:18.3-trixie
    container_name: spp_db
    env_file:
      - .env
    volumes:
      - type: volume
        source: postgres_db
        target: /var/lib/postgresql
    healthcheck:
      test: pg_isready --username=${POSTGRES_USER} --dbname=${POSTGRES_DB}
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
  # Tailwind watch
  tailwind:
    image: swedish_pathogens_portal
    init: true
    pull_policy: never
    entrypoint:
      - sh
      - -c
      - |
        cp /usr/local/lib/daisyui.mjs cms/static/cms/css/daisyui.mjs
        cp /usr/local/lib/daisyui-theme.mjs cms/static/cms/css/daisyui-theme.mjs
        exec tailwindcss \
          --input cms/static/cms/css/base.css \
          --output cms/static/cms/css/portal.css \
          --watch=always
    container_name: spp_tailwind_watch
    working_dir: /app/local
    volumes:
      - type: bind
        source: ./
        target: /app/local
  # S3 instance
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: rootpassword
    command: server --console-address ":9001" /bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - minio_data:/bitnami/minio/data
  # Creates a service account to match deployed service account's permissions
  minio-setup:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    volumes:
      - ./docker/s3_service_account_policy.json:/tmp/api-worker-policy.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin rootpassword;
      mc admin policy create minio s3-api-policy /tmp/api-worker-policy.json;
      mc admin user add minio s3-service-account password;
      mc admin policy attach minio s3-api-policy --user s3-service-account;
      "
# Persistant volume for DB
volumes:
  postgres_db:
  minio_data:
