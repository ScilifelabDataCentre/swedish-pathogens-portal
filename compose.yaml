# docker-compose.yaml
# Docker Compose configuration for Swedish Pathogens Portal (SPP)
---
name: SPP
services:
  # Portal website
  web:
    build:
      context: ./
      dockerfile: Dockerfile
      target: dev
      args:
        with_pygraphviz: ${with_pygraphviz:-false}
    image: swedish_pathogens_portal
    pull_policy: never
    container_name: spp_web
    # Dev-only (this file is the Docker development stack). Production uses
    # gunicorn and never reads this entrypoint. runserver_plus watches the bind
    # mount; a DashboardData save writes into media/ and would otherwise restart
    # the process mid-request. Exclude media and zip so reviewers can upload
    # recovac (and any other) source files without a watchdog bounce.
    entrypoint:
      - python
      - manage.py
      - runserver_plus
      - --nopin
      - --exclude-pattern
      - "*/media/*"
      - --exclude-pattern
      - "*.zip"
      - 0.0.0.0:8000
    env_file:
      - .env
    environment:
      - DATABASE_URL=psql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # Send mail to the mailpit service by default. Set here, not in
      # development.py, which is shared with devbox where the host is 127.0.0.1.
      # ${EMAIL_HOST:-mailpit} still lets .env override (environment: beats
      # env_file:). With mailpit's profile off, sends fail gracefully.
      - EMAIL_HOST=${EMAIL_HOST:-mailpit}
    ports:
      - "8000:8000"
    working_dir: /app/local
    volumes:
      - type: bind
        source: ./
        target: /app/local
    depends_on:
      db:
        condition: service_healthy
        restart: true
      tailwind:
        condition: service_started
  # Postgresql DB
  db:
    image: postgres:18.6-trixie@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
    container_name: spp_db
    env_file:
      - .env
    volumes:
      - type: volume
        source: postgres_db
        target: /var/lib/postgresql
    healthcheck:
      test: pg_isready --username=${POSTGRES_USER} --dbname=${POSTGRES_DB}
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
  # Tailwind watch
  tailwind:
    image: swedish_pathogens_portal
    init: true
    pull_policy: never
    entrypoint:
      - sh
      - -c
      - |
        cp /usr/local/lib/daisyui.mjs cms/static/cms/css/daisyui.mjs
        cp /usr/local/lib/daisyui-theme.mjs cms/static/cms/css/daisyui-theme.mjs
        exec tailwindcss \
          --input cms/static/cms/css/base.css \
          --output cms/static/cms/css/portal.css \
          --watch=always
    container_name: spp_tailwind_watch
    working_dir: /app/local
    volumes:
      - type: bind
        source: ./
        target: /app/local
  # Dev SMTP catcher — opt-in: `docker compose --profile mailpit up`.
  # Catches outbound mail at http://localhost:8025/ (SMTP on 1025). The web
  # service targets this host by default (EMAIL_HOST above); with the profile
  # off, sends fail gracefully (EMAIL_SEND_ERROR), no crash.
  mailpit:
    image: axllent/mailpit:v1.30
    container_name: spp_mailpit
    profiles:
      - "mailpit"
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/"]
      interval: 5s
      timeout: 2s
      retries: 5
# Persistant volume for DB
volumes:
  postgres_db:
