# publish_image.yaml
# Publish Docker image to GitHub Container Registry
---
name: Publish Docker image

on:
  workflow_dispatch:
#  push:
#    branches:
#      - main
#  release:
#    types: [published]
jobs:
  push_to_registry:
    if: github.repository == 'scilifelabdatacentre/swedish-pathogens-portal'
    name: Publish Docker image
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}-docker-build
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to Github Container Repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/scilifelabdatacentre/swedish-pathogens-portal
          tags: |
             type=sha,format=long
             type=sha,prefix={{branch}}-
             type=ref,event=branch
             type=semver,pattern={{version}}
             type=semver,pattern={{major}}.{{minor}}
             type=semver,pattern={{major}}
      - name: Git release build-args
        id: git
        run: |
          RELEASE="${{ github.event.release.tag_name }}"
          DATE="${{ github.event.release.published_at }}"
          if [ -z "${RELEASE}" ]; then
            RELEASE="${{ github.ref_name }}"
          fi
          if [ -z "${DATE}" ]; then
            DATE="$(date -u +%Y-%m-%d)"
          else
            DATE="${DATE%%T*}"
          fi
          echo "release=${RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "date=${DATE}" >> "${GITHUB_OUTPUT}"
      - name: Build and publish backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          file: Dockerfile
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            GIT_RELEASE=${{ steps.git.outputs.release }}
            GIT_RELEASE_DATE=${{ steps.git.outputs.date }}
