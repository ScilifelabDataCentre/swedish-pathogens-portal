# .github/workflows/ruff.yaml
# GitHub Actions workflow for Ruff linting and formatting
---
name: Ruff

on:
  pull_request:
    paths:
      - '*/**.py'
  push:
    branches: [main]
    paths:
      - '*/**.py'

jobs:
  ruff:
    name: Lint & Format with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # version-file makes the Ruff version explicit. Without it the action
      # still finds pyproject.toml by searching upward from `src`, but that is
      # discovery, not a guarantee: if the pin ever moves out of
      # [dependency-groups] the action silently falls back to `latest` and CI
      # lints with a different Ruff than pre-commit does.
      - name: Ruff lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check .
          version-file: pyproject.toml

      - name: Ruff format (check only)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check --diff .
          version-file: pyproject.toml
