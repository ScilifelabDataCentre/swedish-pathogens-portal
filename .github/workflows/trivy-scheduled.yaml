# trivy-scheduled.yaml
# Trivy: Scan of current branch
# Trivy is a comprehensive and versatile security scanner.
# Trivy has scanners that look for security issues,
# and targets where it can find those issues.
# https://github.com/aquasecurity/trivy
#
# This runs on scheduled to run on every Monday and Thursday at 12:12
# --------------------------------------------------------------------
---
name: Trivy - scheduled scan

on:
  workflow_dispatch:
  schedule:
    - cron: '12 12 * * MON,THU'

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy vulnerability scanner
        env:
          TRIVY_DB_REPOSITORY: >-
            ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
        # Pinned by hand: Renovate can't resolve this action (duplicate
        # 0.35.0/v0.35.0 tags upstream, aquasecurity/trivy-action#573), so it
        # never generates a digest. Update this SHA manually.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/scilifelabdatacentre/swedish-pathogens-portal:main
          scanners: "vuln,secret"  # Default but being explicit
          # ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: "0"  # Don't fail job if vuln found (on scheduled)

          # - name: Upload Trivy scan results to GitHub Security tab
          #   if: always()  # Publish results to security tab even if scan fails
          #   uses: github/codeql-action/upload-sarif@v4
          #   with:
          #     sarif_file: 'trivy-results.sarif'
          #     category: trivy-cron
