# Linkchecker (https://github.com/linkchecker/linkchecker)
#
# This action uses `linkchecker` tool to check for broken links
# in the URLs passed via sitemap url.
#
# This workflow is scheduled to run every Monday at 11:11 UTC,
# it can also be run manually from repo's GitHub action page.

---
name: Link Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '11 11 * * MON'

jobs:
  test:
    name: Link Checker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # uv reads .python-version and provisions CPython itself, so no
      # separate actions/setup-python step is needed.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install LinkChecker
        run: uv tool install linkchecker==10.6.0

      - name: Run linkchecker
        run: |
          linkchecker \
            --config ${GITHUB_WORKSPACE}/.github/linkchecker/linkcheckerrc \
            https://www.pathogens.se/sitemap.xml

      - name: Generate LinkChecker summary
        if: always()
        run: |
          if [[ -f linkchecker-results.csv ]]; then
            bash \
              "${GITHUB_WORKSPACE}/.github/linkchecker/generate_summary.sh" \
              linkchecker-results.csv \
              >> "$GITHUB_STEP_SUMMARY"
          fi
